name: Build Flet Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          pip install flet

      # 這裡完全保留你們測試成功、能順利通過互動提示的 yes | 管道語法
      - name: Build APK (Auto-yes for prompts)
        run: |
          yes | flet build apk

      # 調整這裡的名稱，強制對齊你原本唱吧專案的本體名字
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: changba-app  # 👈 這裡改成你的本體專案名字
          path: build/**/*.apk
