name: Build Flet Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 檢出 GitHub 倉庫中的程式碼
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 設定 Java 17 環境（Flet 打包 Android 核心依賴，缺少必噴錯）
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. 設定最新的 Stable Flutter 渲染引擎（Flet 容器底層，缺少必噴錯）
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 4. 設定 Python 環境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 5. 更新 pip 並安裝 Flet 框架工具
      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          pip install flet

      # 6. 執行 Flet 標準打包指令（使用官方 --yes 參數，乾淨不衝突）
      - name: Build Android APK
        run: |
          flet build apk --yes

      # 7. 將打包生成的 APK 檔案上傳（精準指定 Flet 產出路徑，名稱完全對齊專案）
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: changba-app
          path: build/apk/*.apk
