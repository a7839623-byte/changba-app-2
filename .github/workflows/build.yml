name: Build Flet Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 完全保留你之前成功的環境，只安裝最新 pip 與 flet
      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          pip install flet

      # ⚠️ 丟掉 yes |，改用官方內建的 --yes 參數，這樣帶有權限的 toml 就不會報錯
      - name: Build APK (Auto-yes for prompts)
        run: |
          flet build apk --yes

      # 上傳並強制命名為 changba-app
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: changba-app
          path: build/**/*.apk
